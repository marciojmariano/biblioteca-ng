<div class="card">
    <div class="flex justify-content-end flex-wrap mt-2 mr-2"> <p-button label="Cadastrar" icon="pi pi-user-plus"
            routerLink="/alunos/cadastro" /> </div>
    <div class="mt-2 mr-2 ml-2"> <p-table [value]="alunos" [tableStyle]="{ 'min-width': '50rem' }" [rows]="5"
            [paginator]="true" [rowsPerPageOptions]="[5, 10, 20]"> <ng-template #header>
                <tr>
                    <th pSortableColumn="nome">
                        <div class="flex items-center gap-1 justify-center"> Nome<p-sortIcon field="nome" /> </div>
                    </th>
                    <th pSortableColumn="sobrenome">
                        <div class="flex items-center gap-1 justify-center"> Sobrenome<p-sortIcon
                                field="sobrenome" /> </div>
                    </th>
                    <th pSortableColumn="dataNascimento">
                        <div class="flex justify-center items-center gap-1"> Data de Nascimento<p-sortIcon
                                field="dataNascimento" /> </div>
                    </th>
                    <th pSortableColumn="cpf">
                        <div class="flex justify-center items-center gap-1"> CPF<p-sortIcon field="cpf" /> </div>
                    </th>
                    <th pSortableColumn="acoes">
                        <div class="flex justify-center"> Ações </div>
                    </th>
                </tr>
            </ng-template> <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.sobrenome }}</td>
                    <td>{{ aluno.dataNascimento | date:"dd/MM/yyyy"}}</td>
                    <td>{{ aluno.cpf }}</td>
                    <td> <p-button class="mr-1" label="Editar" icon="pi pi-pencil"
                            routerLink="/alunos/alterar/{{aluno.id}}" severity="warn" /> <p-button label="Excluir"
                            icon="pi pi-trash" (click)="confirmarParaApagar($event, aluno)" severity="danger"
                            [outlined]="true" /> </td>
                </tr>
            </ng-template> </p-table> </div>
</div>
