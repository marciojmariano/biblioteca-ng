<div class="card">
    <p-button label="Cadastrar" icon="pi pi-user-plus" routerLink="/alunos/cadastro" />
    <p-table [value]="alunos" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>id</th>
                <th>Nome</th>
                <th>Sobrenome</th>
                <th>Data de Nascimento</th>
                <th>Cpf</th>
                <th>Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-aluno>
            <tr>
                <td>{{ aluno.id }}</td>
                <td>{{ aluno.nome }}</td>
                <td>{{ aluno.sobrenome }}</td>
                <td>{{ aluno.dataNascimento }}</td>
                <td>{{ aluno.cpf }}</td>
                <td>
                    <p-button label="Alterar" icon="pi pi-refresh" routerLink="/alunos/alterar/{{aluno.id}}" />
                    <p-button label="Apagar" icon="pi pi-trash" (click)="confirmarParaApagar($event, aluno)"
                        severity="danger" [outlined]="true" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
